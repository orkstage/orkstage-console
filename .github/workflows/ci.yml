name: CI

on:
  # Pull requests are built; merges to main are not built again. Pull requests that only change
  # Markdown or docs/ skip CI. A weekly run on main scans for secrets and refreshes the caches that
  # pull requests restore (a pull request can only reuse caches saved on main).
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Read access to the @orkstage/* packages in GitHub Packages.
  packages: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner --verbose
      # Every source file has an SPDX license header; core code does not import ee/ (scripts/spdx.sh).
      - name: License headers and the ee/ boundary
        run: bash scripts/spdx.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@orkstage'

      # The console depends on @orkstage/contracts, /authorization, /templates and /domain,
      # published by the orkstage repository. Until they are published, there is nothing to
      # install against: report it and skip the remaining steps instead of failing every run.
      - name: Check that the shared packages are published
        id: packages
        run: |
          if npm view @orkstage/contracts version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Console build skipped::@orkstage/contracts is not published to GitHub Packages yet, so dependencies cannot be installed."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.packages.outputs.available == 'true'
        with:
          version: 12.5.1

      # No lockfile is committed until the first install against the published packages.
      - name: Install
        if: steps.packages.outputs.available == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi

      - name: Typecheck
        if: steps.packages.outputs.available == 'true'
        run: pnpm typecheck

      - name: Build
        if: steps.packages.outputs.available == 'true'
        run: pnpm build
        env:
          API_INTERNAL_URL: http://localhost:4000
