name: CI

on:
  # Public repository: Actions minutes are free, so every push to main and every pull request is
  # built, plus a weekly run that keeps caches warm.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Read access to the @orkstage/* packages in GitHub Packages.
  packages: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --no-banner --verbose
      # Every source file has an SPDX license header; core code does not import ee/ (scripts/spdx.sh).
      - name: License headers and the ee/ boundary
        run: bash scripts/spdx.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          registry-url: https://npm.pkg.github.com
          scope: '@orkstage'

      # The console depends on @orkstage/contracts, /authorization, /templates and /domain,
      # published by the orkstage repository to GitHub Packages.
      - name: Check that the shared packages are published
        id: packages
        run: |
          if npm view @orkstage/contracts version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Shared packages from source::@orkstage/contracts is not published to GitHub Packages yet; building the console against orkstage main instead."
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      # Until the shared packages are published, build them from orkstage main and link them, as
      # the orkstage-dev workspace does, so every change is still installed, typechecked and built.
      # `.core/` sits inside the checkout so Next.js resolves the links within its project root.
      - name: Shared packages from the orkstage repository
        if: steps.packages.outputs.available != 'true'
        run: |
          git clone --depth 1 https://github.com/orkstage/orkstage.git .core
          echo "Core packages from orkstage@$(git -C .core rev-parse --short HEAD)"
          (cd .core && pnpm install --frozen-lockfile \
            && pnpm --filter "@orkstage/contracts..." --filter "@orkstage/authorization..." \
              --filter "@orkstage/templates..." --filter "@orkstage/domain..." run build)
          cat > pnpm-workspace.yaml <<'YAML'
          overrides:
            '@orkstage/domain': link:./.core/packages/domain
            '@orkstage/contracts': link:./.core/packages/contracts
            '@orkstage/authorization': link:./.core/packages/authorization
            '@orkstage/templates': link:./.core/packages/templates
          YAML

      # No lockfile is committed until the first install against the published packages.
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi

      - name: Typecheck
        run: pnpm typecheck

      # Every message key exists in English and Brazilian Portuguese (scripts/check-i18n.mjs).
      - name: Translations
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          API_INTERNAL_URL: http://localhost:4000
